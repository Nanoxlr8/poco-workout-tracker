<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#neonGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Calisthenics Pull-up Bar & Athlete / Weights Motif -->
  <g filter="url(#neonGlow)">
    <!-- Top Horizontal Bar -->
    <rect x="76" y="110" width="360" height="24" rx="12" fill="url(#neonGrad)" />
    <!-- Bar Mounts -->
    <path d="M120 110 L120 60 M392 110 L392 60" stroke="url(#neonGrad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Central Dumbbell / Calisthenics Core -->
    <g transform="translate(256, 290)">
      <!-- Central Grip -->
      <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#FFFFFF" />
      <!-- Left Weights -->
      <rect x="-115" y="-55" width="26" height="110" rx="10" fill="url(#neonGrad)" />
      <rect x="-145" y="-42" width="22" height="84" rx="8" fill="url(#neonGrad)" opacity="0.85" />
      <rect x="-165" y="-28" width="14" height="56" rx="6" fill="url(#neonGrad)" opacity="0.7" />
      <!-- Right Weights -->
      <rect x="89" y="-55" width="26" height="110" rx="10" fill="url(#neonGrad)" />
      <rect x="123" y="-42" width="22" height="84" rx="8" fill="url(#neonGrad)" opacity="0.85" />
      <rect x="151" y="-28" width="14" height="56" rx="6" fill="url(#neonGrad)" opacity="0.7" />
    </g>

    <!-- Upward Strength Chevron / Arrow -->
    <path d="M190 200 L256 145 L322 200" fill="none" stroke="#00F5FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M210 230 L256 190 L302 230" fill="none" stroke="#00E676" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  </g>
  
  <!-- Subtle Poco F5 badge text / emblem -->
  <text x="256" y="440" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" letter-spacing="4">POCO WORKOUT</text>
</svg>
